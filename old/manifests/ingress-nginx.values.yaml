controller:
  replicaCount: 2

  # Saúde mais tolerante (evita reinícios por lentidão)
  livenessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 10
    failureThreshold: 5

  # Corrige "permission denied" ao bindar portas 80/443
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    allowPrivilegeEscalation: true
    readOnlyRootFilesystem: true
    capabilities:
      add:
        - NET_BIND_SERVICE
  # (Plano B, só se ainda falhar)
  # containerSecurityContext:
  #   runAsNonRoot: false
  #   runAsUser: 0
  #   allowPrivilegeEscalation: true

  # Se o worker cair, pode rodar no control-plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    # dá mais tempo antes de evitar quando o nó fica unreachable
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 600

  # Espalhar pods entre nós diferentes quando possível
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-nginx
                app.kubernetes.io/component: controller

  # Publicação via Service (necessário p/ status e anúncios)
  publishService:
    enabled: true

  # Recursos mínimos (evita pressão de memória/cpu no nó)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    loadBalancerIP: 192.168.30.101
    annotations:
      metallb.universe.tf/address-pool: pool-bridge
