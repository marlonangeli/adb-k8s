apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool-bridge
  namespace: metallb-system
spec:
  addresses:
    - 192.168.30.100-192.168.30.120
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - pool-bridge
