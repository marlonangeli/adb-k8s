apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool-bridge
  namespace: metallb-system
spec:
  addresses:
    - ${LB_POOL_START}-${LB_POOL_END}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2
  namespace: metallb-system
spec:
  ipAddressPools: [ "pool-bridge" ]
